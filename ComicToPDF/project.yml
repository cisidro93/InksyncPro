name: InksyncPro
options:
  bundleIdPrefix: com.antigravity
  deploymentTarget:
    iOS: "17.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
  Unrar:
    url: https://github.com/mtgto/Unrar.swift.git
    from: 0.5.2

targets:
  InksyncPro:
    type: application
    platform: iOS
    sources:
      - path: ComicToPDF
        excludes:
          - "**/*.md"
          - "**/*.txt"
          - "reference files/**"
          - "ComicToPDFShare/**"

    dependencies:
      - package: ZIPFoundation
      - package: Unrar
      - target: ComicToPDFShare
        embed: true

    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antigravity.InksyncPro
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_ENTITLEMENTS: ComicToPDF/ComicToPDF.entitlements
        INFOPLIST_FILE: ComicToPDF/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        Input_File_Path: $(SRCROOT)/ComicToPDF/Info.plist
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
          SWIFT_COMPILATION_MODE: singlefile
          GCC_OPTIMIZATION_LEVEL: 0
          DEBUG_INFORMATION_FORMAT: dwarf
          ENABLE_TESTABILITY: YES
          OTHER_SWIFT_FLAGS: $(inherited) -Xfrontend -warn-long-expression-type-checking=150 -Xfrontend -warn-long-function-bodies=150
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
          SWIFT_COMPILATION_MODE: wholemodule
          GCC_OPTIMIZATION_LEVEL: s
          LLVM_LTO: YES_THIN
          DEAD_CODE_STRIPPING: YES
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          VALIDATE_PRODUCT: YES
          ENABLE_NS_ASSERTIONS: NO
          COMPRESS_PNG_FILES: YES
          ASSETCATALOG_COMPILER_OPTIMIZATION: space
    info:
      path: ComicToPDF/Info.plist
      properties:
        CFBundleVersion: "2"
        CFBundleShortVersionString: "1.0.1"
        GitCommitSHA: "local"
        UILaunchStoryboardName: LaunchScreen
        UIRequiresFullScreen: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers:
          - "com.antigravity.InksyncPro.autosync"
        ITSAppUsesNonExemptEncryption: false
        CADisableMinimumFrameDurationOnPhone: true
        NSLocalNetworkUsageDescription: "InksyncPro requires local network access to securely transfer comic files over your Wi-Fi and to discover Calibre libraries on your network."
        NSBonjourServices:
          - "_calibrewireless._tcp"
          - "_inksync._tcp"
        CFBundleURLTypes:
          - CFBundleURLName: com.antigravity.InksyncPro.oauth
            CFBundleURLSchemes:
              - inksyncpro
              - inksync
        UIAppFonts:
          - AtkinsonHyperlegible-Regular.ttf
          - AtkinsonHyperlegible-Bold.ttf
          - AtkinsonHyperlegible-Italic.ttf
          - AtkinsonHyperlegible-BoldItalic.ttf
          - Literata-Regular.ttf
          - Literata-Bold.ttf
          - Literata-Italic.ttf
          - Literata-BoldItalic.ttf
          - OpenDyslexic-Regular.otf
          - OpenDyslexic-Bold.otf
          - OpenDyslexic-Italic.otf
          - OpenDyslexic-BoldItalic.otf
          - Merriweather-Regular.ttf
          - Merriweather-Bold.ttf
          - Merriweather-Italic.ttf
          - Merriweather-BoldItalic.ttf
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Comic Book ZIP Archive"
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.macrabbit.comicbookzip
              - com.antigravity.cbz
              - public.cbz-archive
              - public.zip-archive
              - public.archive
              - com.pkware.zip-archive
              - public.data
              - public.content
              - public.item
          - CFBundleTypeName: "Comic Book RAR Archive"
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.macrabbit.comicbookrar
              - com.antigravity.cbr
              - public.cbr-archive
              - com.rarlab.rar-archive
              - public.rar-archive
              - public.archive
              - public.data
              - public.content
              - public.item
          - CFBundleTypeName: "7-Zip Comic Archive"
            LSHandlerRank: Owner
            LSItemContentTypes:
              - org.7-zip.7-zip-archive
              - public.archive
              - public.data
              - public.content
              - public.item
          - CFBundleTypeName: "PDF Document"
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.adobe.pdf
              - public.pdf
              - public.composite-content
              - public.data
              - public.content
              - public.item
          - CFBundleTypeName: "EPUB eBook"
            LSHandlerRank: Owner
            LSItemContentTypes:
              - org.idpf.epub-container
              - public.epub
              - public.data
              - public.content
              - public.item
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: public.comma-separated-values-text
            UTTypeDescription: CSV File
            UTTypeConformsTo: [public.text]
            UTTypeTagSpecification:
              public.filename-extension: [csv]
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown]
          - UTTypeIdentifier: com.macromates.textpad.snippet
            UTTypeDescription: Text File
            UTTypeConformsTo: [public.text]
            UTTypeTagSpecification:
              public.filename-extension: [txt]
          - UTTypeIdentifier: com.macrabbit.comicbookzip
            UTTypeDescription: Comic Book ZIP Archive
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [cbz]
          - UTTypeIdentifier: com.macrabbit.comicbookrar
            UTTypeDescription: Comic Book RAR Archive
            UTTypeConformsTo: [public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [cbr]
          - UTTypeIdentifier: com.adobe.pdf
            UTTypeDescription: PDF Document
            UTTypeConformsTo: [public.data, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [pdf, PDF]
              public.mime-type: [application/pdf]
          - UTTypeIdentifier: org.idpf.epub-container
            UTTypeDescription: Electronic Publication (EPUB)
            UTTypeConformsTo: [public.data, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [epub, EPUB]
              public.mime-type: [application/epub+zip]
          - UTTypeIdentifier: com.rarlab.rar-archive
            UTTypeDescription: RAR Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [rar, RAR]
          - UTTypeIdentifier: org.7-zip.7-zip-archive
            UTTypeDescription: 7-Zip Archive
            UTTypeConformsTo: [public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [7z, cb7]
          - UTTypeIdentifier: public.tar-archive
            UTTypeDescription: Comic Book Tar Archive
            UTTypeConformsTo: [public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [tar, cbt]
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.antigravity.cbz
            UTTypeDescription: Comic Book Archive (Zip)
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [cbz]
          - UTTypeIdentifier: com.antigravity.cbr
            UTTypeDescription: Comic Book Archive (Rar)
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [cbr]
          - UTTypeIdentifier: com.inksyncpro.library.dragpayload
            UTTypeDescription: InksyncPro Library Drag Payload
            UTTypeConformsTo: [public.data]

  ComicToPDFShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ComicToPDFShare
    info:
      path: ComicToPDFShare/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antigravity.InksyncPro.ComicToPDFShare
        INFOPLIST_FILE: ComicToPDFShare/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_ENTITLEMENTS: ComicToPDFShare/ComicToPDFShare.entitlements
        SWIFT_VERSION: "6.0"
