name: Build Native iOS App

on:
  push:
    branches: [ "main", "ios-port" ]
  pull_request:
    branches: [ "main", "ios-port" ]

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Redirect module cache to /tmp so it is NEVER cached between runs.
      # This is the definitive fix for "mtime changed" SwiftShims errors.
      CLANG_MODULE_CACHE_PATH: /tmp/clang-module-cache
      SHORT_SHA: ""

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # full history needed for accurate commit count

    - name: Set build metadata
      run: |
        # Increment build number on every commit — prevents Signulous from
        # serving a cached IPA when the filename hasn't changed.
        BUILD_NUMBER=$(git rev-list --count HEAD)
        SHORT_SHA=$(git rev-parse --short HEAD)
        echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
        echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
        echo "Build number: $BUILD_NUMBER  SHA: $SHORT_SHA"

    - name: Select Xcode
      run: |
        # Log the Xcode version for traceability
        xcodebuild -version
        sudo xcode-select -p

    - name: Install Tools
      run: |
        brew install swiftlint
        brew install xcodegen || true

    - name: Run SwiftLint
      run: swiftlint lint
      continue-on-error: true

    - name: Debug Files
      run: ls -R

    - name: Cache SPM Packages
      uses: actions/cache@v4
      with:
        # Only cache resolved SPM source checkouts — never compiled .pcm or .o files
        path: ComicToPDF/build/SourcePackages/checkouts
        key: ${{ runner.os }}-spm-${{ hashFiles('ComicToPDF/project.yml') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Generate Project
      run: |
        cd ComicToPDF
        # Stamp the unique build number into project.yml Info properties
        # so xcodegen writes the dynamic build number into the target build settings.
        sed -i '' "s/CFBundleVersion: \"2\"/CFBundleVersion: \"$BUILD_NUMBER\"/g" project.yml
        # Stamp Info.plist as fallback
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ComicToPDF/Info.plist
        echo "Stamped CFBundleVersion = $BUILD_NUMBER in project.yml and Info.plist"
        xcodegen generate

    - name: Build App
      run: |
        cd ComicToPDF
        xcodebuild -list -project InksyncPro.xcodeproj
        xcodebuild -project InksyncPro.xcodeproj \
                   -scheme InksyncPro \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath build \
                   CLANG_MODULE_CACHE_PATH=/tmp/clang-module-cache \
                   build \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO > build.log 2>&1

    - name: Post build errors to commit
      if: failure()
      run: |
        cd ComicToPDF
        echo "=== XCODEBUILD ERROR LOG ==="
        grep -i -n -C 3 "error:" build.log | head -n 100
        
        # Post error diagnostics as a commit comment
        echo "### Build Failure Diagnostics" > raw_comment.txt
        echo "" >> raw_comment.txt
        echo "#### Compilation Errors:" >> raw_comment.txt
        echo '```' >> raw_comment.txt
        grep -i -n -C 3 "error:" build.log | head -n 100 >> raw_comment.txt
        echo '```' >> raw_comment.txt
        echo "" >> raw_comment.txt
        echo "#### Trailing Log Output:" >> raw_comment.txt
        echo '```' >> raw_comment.txt
        tail -n 150 build.log >> raw_comment.txt
        echo '```' >> raw_comment.txt
        
        jq -n --arg body "$(cat raw_comment.txt)" '{"body": $body}' > comment.json

        curl -s -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          -d @comment.json \
          "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments"

    - name: Package IPA
      run: |
        cd ComicToPDF
        mkdir Payload
        # Crucial Fix: Use 'cp -a' instead of 'cp -r' to preserve executable permissions and symlinks
        cp -a build/Build/Products/Release-iphoneos/InksyncPro.app Payload/
        # Crucial Fix: Use 'zip -ry' instead of 'zip -r' to preserve symlinks
        zip -ry InksyncPro_Unsigned_${{ env.SHORT_SHA }}.ipa Payload

    - name: Upload Unsigned IPA to File Host and Post Commit Comment
      run: |
        cd ComicToPDF
        echo "Uploading to x0.at..."
        UPLOAD_RESPONSE=$(curl -s -F "file=@InksyncPro_Unsigned_${{ env.SHORT_SHA }}.ipa" https://x0.at/ || true)
        DOWNLOAD_URL=$(echo "$UPLOAD_RESPONSE" | grep -o -E "https://x0.at/[a-zA-Z0-9./_-]+" || true)
        
        if [ -z "$DOWNLOAD_URL" ]; then
          echo "x0.at failed, trying BashUpload..."
          UPLOAD_RESPONSE=$(curl -s https://bashupload.com/ -T InksyncPro_Unsigned_${{ env.SHORT_SHA }}.ipa || true)
          DOWNLOAD_URL=$(echo "$UPLOAD_RESPONSE" | grep -o -E "https://bashupload.com/[a-zA-Z0-9./_-]+" || true)
        fi
        
        if [ -z "$DOWNLOAD_URL" ]; then
          echo "BashUpload failed, trying transfer.sh..."
          UPLOAD_RESPONSE=$(curl -s --upload-file InksyncPro_Unsigned_${{ env.SHORT_SHA }}.ipa https://transfer.sh/InksyncPro_Unsigned_${{ env.SHORT_SHA }}.ipa || true)
          DOWNLOAD_URL=$(echo "$UPLOAD_RESPONSE" | grep -o -E "https://transfer.sh/[a-zA-Z0-9./_-]+" || true)
        fi
        
        if [ -n "$DOWNLOAD_URL" ]; then
          echo "Direct download URL: $DOWNLOAD_URL"
          echo "### Unsigned Build Complete 🚀" > comment.txt
          echo "" >> comment.txt
          echo "Download the raw \`.ipa\` file directly on your iPad using this link (no extraction or GitHub login required):" >> comment.txt
          echo "" >> comment.txt
          echo "👉 **[Download InksyncPro_Unsigned_${{ env.SHORT_SHA }}.ipa]($DOWNLOAD_URL)**" >> comment.txt
          
          jq -n --arg body "$(cat comment.txt)" '{"body": $body}' > comment.json
          
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d @comment.json \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments"
        else
          echo "Warning: All upload hosts failed."
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: InksyncPro_Unsigned_${{ env.SHORT_SHA }}
        path: ComicToPDF/InksyncPro_Unsigned_${{ env.SHORT_SHA }}.ipa
