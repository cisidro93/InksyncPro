name: Build Native iOS App

on:
  push:
    branches: [ "main", "ios-port" ]
  pull_request:
    branches: [ "main", "ios-port" ]

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Redirect module cache to /tmp so it is NEVER cached between runs.
      # This is the definitive fix for "mtime changed" SwiftShims errors.
      CLANG_MODULE_CACHE_PATH: /tmp/clang-module-cache
      SHORT_SHA: ""
      HAS_SIGNING_SECRET: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # full history needed for accurate commit count

    - name: Set build metadata
      run: |
        # Increment build number on every commit — prevents Signulous from
        # serving a cached IPA when the filename hasn't changed.
        BUILD_NUMBER=$(git rev-list --count HEAD)
        SHORT_SHA=$(git rev-parse --short HEAD)
        echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
        echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
        echo "Build number: $BUILD_NUMBER  SHA: $SHORT_SHA"

    - name: Select Xcode
      run: |
        # Log the Xcode version for traceability
        xcodebuild -version
        sudo xcode-select -p

    - name: Install Tools
      run: |
        brew install swiftlint
        brew install xcodegen || true

    - name: Run SwiftLint
      run: swiftlint lint
      continue-on-error: true

    - name: Debug Files
      run: ls -R

    - name: Cache SPM Packages
      uses: actions/cache@v4
      with:
        # Only cache resolved SPM source checkouts — never compiled .pcm or .o files
        path: ComicToPDF/build/SourcePackages/checkouts
        key: ${{ runner.os }}-spm-${{ hashFiles('ComicToPDF/project.yml') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Install Apple Certificate and Provisioning Profile
      if: ${{ env.HAS_SIGNING_SECRET != '' }}
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        KEYCHAIN_PASSWORD: "temporary_keychain_password"
      run: |
        CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
        PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

        # Decode base64 strings back into files
        echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
        echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

        # Create and configure temporary keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security default-keychain -s $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH

        # Import certificate
        security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        # Install provisioning profile
        UUID=$(grep -aA1 "UUID" $PP_PATH | grep -o "[-A-Z0-9]\{36\}")
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
        echo "Installed Provisioning Profile: $UUID"

    - name: Generate Project
      run: |
        cd ComicToPDF
        # Stamp the unique build number into project.yml Info properties
        # so xcodegen writes the dynamic build number into the target build settings.
        sed -i '' "s/CFBundleVersion: \"2\"/CFBundleVersion: \"$BUILD_NUMBER\"/g" project.yml
        # Stamp Info.plist as fallback
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ComicToPDF/ComicToPDF/Info.plist
        echo "Stamped CFBundleVersion = $BUILD_NUMBER in project.yml and Info.plist"
        xcodegen generate

    - name: Build Archive
      if: ${{ env.HAS_SIGNING_SECRET != '' }}
      env:
        DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      run: |
        cd ComicToPDF
        xcodebuild -project InksyncPro.xcodeproj \
                   -scheme InksyncPro \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath build \
                   -archivePath build/InksyncPro.xcarchive \
                   CLANG_MODULE_CACHE_PATH=/tmp/clang-module-cache \
                   archive \
                   CODE_SIGN_IDENTITY="Apple Distribution" \
                   CODE_SIGNING_REQUIRED=YES \
                   CODE_SIGNING_ALLOWED=YES \
                   DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" > build.log 2>&1

    - name: Build Unsigned App
      if: ${{ env.HAS_SIGNING_SECRET == '' }}
      run: |
        cd ComicToPDF
        xcodebuild -project InksyncPro.xcodeproj \
                   -scheme InksyncPro \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath build \
                   CLANG_MODULE_CACHE_PATH=/tmp/clang-module-cache \
                   build \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO > build.log 2>&1

    - name: Post build errors to commit
      if: failure()
      run: |
        cd ComicToPDF
        echo "=== XCODEBUILD ERROR LOG ==="
        grep -i -n -C 3 "error:" build.log | head -n 100
        
        # Post error diagnostics as a commit comment
        echo "### Build Failure Diagnostics" > raw_comment.txt
        echo "" >> raw_comment.txt
        echo "#### Compilation Errors:" >> raw_comment.txt
        echo '```' >> raw_comment.txt
        grep -i -n -C 3 "error:" build.log | head -n 100 >> raw_comment.txt
        echo '```' >> raw_comment.txt
        echo "" >> raw_comment.txt
        echo "#### Trailing Log Output:" >> raw_comment.txt
        echo '```' >> raw_comment.txt
        tail -n 150 build.log >> raw_comment.txt
        echo '```' >> raw_comment.txt
        
        jq -n --arg body "$(cat raw_comment.txt)" '{"body": $body}' > comment.json

        curl -s -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          -d @comment.json \
          "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments"

    - name: Export IPA
      if: ${{ env.HAS_SIGNING_SECRET != '' }}
      env:
        DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
      run: |
        cd ComicToPDF
        sed -i '' "s/TEAM_ID_PLACEHOLDER/$DEVELOPMENT_TEAM/g" ExportOptions.plist
        sed -i '' "s/PROVISIONING_PROFILE_NAME_PLACEHOLDER/$PROVISIONING_PROFILE_NAME/g" ExportOptions.plist
        
        xcodebuild -exportArchive \
                   -archivePath build/InksyncPro.xcarchive \
                   -exportOptionsPlist ExportOptions.plist \
                   -exportPath build/exported \
                   -allowProvisioningUpdates
                   
        cp build/exported/InksyncPro.ipa InksyncPro_Signed_${{ env.SHORT_SHA }}.ipa

    - name: Package Unsigned IPA
      if: ${{ env.HAS_SIGNING_SECRET == '' }}
      run: |
        cd ComicToPDF
        mkdir Payload
        cp -a build/Build/Products/Release-iphoneos/InksyncPro.app Payload/
        # Name the IPA with the SHA so Signulous sees a unique file each upload
        zip -ry InksyncPro_Unsigned_${{ env.SHORT_SHA }}.ipa Payload

    - name: Validate and Upload to App Store Connect (TestFlight)
      if: ${{ env.HAS_SIGNING_SECRET != '' }}
      env:
        API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      run: |
        cd ComicToPDF
        mkdir -p ~/.private_keys
        echo -n "$API_KEY_BASE64" | base64 --decode -o ~/.private_keys/AuthKey_$KEY_ID.p8
        
        # Validate build first
        echo "Validating App Store package..."
        xcrun altool --validate-app \
                     -f InksyncPro_Signed_${{ env.SHORT_SHA }}.ipa \
                     -t ios \
                     --apiKey "$KEY_ID" \
                     --apiIssuer "$ISSUER_ID"
                     
        # Upload build
        echo "Uploading App Store package..."
        xcrun altool --upload-app \
                     -f InksyncPro_Signed_${{ env.SHORT_SHA }}.ipa \
                     -t ios \
                     --apiKey "$KEY_ID" \
                     --apiIssuer "$ISSUER_ID"

    - name: Upload Signed IPA Artifact
      if: ${{ env.HAS_SIGNING_SECRET != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: InksyncPro_Signed_${{ env.SHORT_SHA }}
        path: ComicToPDF/InksyncPro_Signed_${{ env.SHORT_SHA }}.ipa

    - name: Upload Unsigned IPA Artifact
      if: ${{ env.HAS_SIGNING_SECRET == '' }}
      uses: actions/upload-artifact@v4
      with:
        name: InksyncPro_Unsigned_${{ env.SHORT_SHA }}
        path: ComicToPDF/InksyncPro_Unsigned_${{ env.SHORT_SHA }}.ipa

    - name: Clean up Keychain and Credentials
      if: ${{ always() && env.HAS_SIGNING_SECRET != '' }}
      run: |
        security delete-keychain app-signing.keychain-db || true
        rm -rf ~/.private_keys || true
